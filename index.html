<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Scanner Buku</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <script src="html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #EEF1EC;
      --surface: #FFFFFF;
      --ink: #1C2321;
      --muted: #5B6661;
      --green: #2D5A45;
      --green-soft: #DCE8E1;
      --stamp: #F2C14E;
      --error: #B3261E;
      --error-soft: #F9E1DE;
      --line: #D3D9D4;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111715;
        --surface: #1A2220;
        --ink: #E6EBE7;
        --muted: #9AA6A0;
        --green: #7FC4A0;
        --green-soft: #1F3A2E;
        --stamp: #F2C14E;
        --error: #FF8A80;
        --error-soft: #3A1E1C;
        --line: #2C3633;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 4px 0 2px;
    }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }

    /* Kamera */
    .viewfinder {
      --warna-bingkai: #FFFFFF;
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      max-height: 62vh;
      width: 100%;
    }
    #reader { position: absolute; inset: 0; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; display: block; }
    #reader canvas, #reader img { display: none !important; }
    .idle {
      position: absolute; inset: 0;
      display: grid; place-items: center; text-align: center;
      color: #C9D2CD; padding: 24px; font-size: 15px;
    }
    .idle svg { display: block; margin: 0 auto 10px; opacity: .85; }
    .viewfinder.aktif .idle { display: none; }

    /* Bingkai bidik: masker gelap di luar kotak, sudut tebal, garis laser */
    .bingkai {
      display: none;
      position: absolute;
      left: 8%; right: 8%; top: 30%; height: 34%;
      border-radius: 14px;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55);
      transition: box-shadow .2s;
    }
    .viewfinder.aktif .bingkai { display: block; }
    .sudut { position: absolute; width: 30px; height: 30px; border: 0 solid var(--warna-bingkai); transition: border-color .15s; }
    .sudut.tl { top: -3px; left: -3px; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 14px; }
    .sudut.tr { top: -3px; right: -3px; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 14px; }
    .sudut.bl { bottom: -3px; left: -3px; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 14px; }
    .sudut.br { bottom: -3px; right: -3px; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 14px; }
    .laser {
      position: absolute; left: 6%; right: 6%; top: 50%;
      height: 2px; border-radius: 2px;
      background: #FF4D3D;
      box-shadow: 0 0 10px 2px rgba(255, 77, 61, .7);
      animation: laser 1.8s ease-in-out infinite alternate;
    }
    @keyframes laser { from { top: 12%; } to { top: 88%; } }
    @media (prefers-reduced-motion: reduce) { .laser { animation: none; } }
    .petunjuk {
      position: absolute; left: 0; right: 0; top: calc(100% + 14px);
      text-align: center; color: #fff; font-size: 14px; font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    }
    .petunjuk-atas { top: auto; bottom: calc(100% + 14px); font-weight: 400; opacity: .85; }

    /* Status di dalam viewfinder */
    .viewfinder[data-state="proses"] .laser,
    .viewfinder[data-state="ok"] .laser,
    .viewfinder[data-state="gagal"] .laser { display: none; }
    .viewfinder[data-state="proses"] { --warna-bingkai: var(--stamp); }
    .viewfinder[data-state="ok"] { --warna-bingkai: #3DDC84; }
    .viewfinder[data-state="gagal"] { --warna-bingkai: #FF5A4D; }
    .viewfinder[data-state="proses"] .bingkai,
    .viewfinder[data-state="ok"] .bingkai,
    .viewfinder[data-state="gagal"] .bingkai { box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .72); }
    .lencana {
      display: none;
      position: absolute; inset: 0;
      place-items: center;
      color: #fff; font-weight: 800; font-size: 18px; text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .9);
    }
    .viewfinder[data-state="proses"] .lencana,
    .viewfinder[data-state="ok"] .lencana,
    .viewfinder[data-state="gagal"] .lencana { display: grid; }
    .putar {
      width: 22px; height: 22px; margin: 0 auto 6px;
      border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff;
      border-radius: 50%; animation: putar .8s linear infinite;
    }
    .viewfinder:not([data-state="proses"]) .putar { display: none; }
    @keyframes putar { to { transform: rotate(360deg); } }

    /* Tombol */
    .aksi { display: flex; gap: 10px; margin-top: 14px; }
    button, .tombol-file {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      min-height: 52px;
    }
    #btnScan { flex: 1; background: var(--green); color: var(--bg); }
    #btnScan.stop { background: var(--ink); color: var(--bg); }
    .tombol-file {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
    }
    #foto { position: absolute; width: 1px; height: 1px; opacity: 0; }
    button:focus-visible, .tombol-file:focus-within { outline: 3px solid var(--stamp); outline-offset: 2px; }

    /* Status */
    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 15px;
      min-height: 46px;
    }
    #status.error { background: var(--error-soft); color: var(--error); }
    #status.proses { color: var(--ink); }

    /* Hasil terakhir */
    #hasil { display: none; position: relative; margin-top: 16px; padding: 18px 18px 16px; background: var(--surface); border-radius: 16px; border: 1.5px solid var(--line); }
    #hasil.tampil { display: block; }
    #hasil .judul { font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 6px; padding-right: 90px; }
    #hasil .meta { color: var(--muted); margin: 0; font-size: 15px; }
    #hasil .isbn { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cap {
      position: absolute; top: 14px; right: 14px;
      border: 2.5px solid var(--stamp);
      color: var(--stamp);
      border-radius: 8px;
      padding: 3px 8px;
      font-weight: 800;
      font-size: 13px;
      transform: rotate(-8deg);
    }
    #hasil.baru .cap { animation: cap .35s cubic-bezier(.2,1.6,.4,1); }
    @keyframes cap { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #hasil.baru .cap { animation: none; } }
    .tidak-ketemu .cap { border-color: var(--muted); color: var(--muted); }

    /* Riwayat sesi */
    h2 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; }
    h2 span { color: var(--muted); font-weight: 400; }
    #riwayat { list-style: none; margin: 0; padding: 0; }
    #riwayat li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    #riwayat li:last-child { border-bottom: 0; }
    #riwayat .r-judul { font-weight: 600; }
    #riwayat .r-meta { color: var(--muted); font-size: 14px; }
    .kosong { color: var(--muted); font-size: 15px; }

    #file-reader { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Scanner Buku</h1>
    <p class="sub">Arahkan kamera ke barcode di sampul belakang buku.</p>

    <div class="viewfinder" id="viewfinder">
      <div id="reader"></div>
      <div class="idle">
        <div>
          <svg width="64" height="40" viewBox="0 0 64 40" aria-hidden="true" fill="currentColor">
            <rect x="0" y="0" width="3" height="40"/><rect x="6" y="0" width="1.5" height="40"/>
            <rect x="10" y="0" width="4" height="40"/><rect x="17" y="0" width="1.5" height="40"/>
            <rect x="21" y="0" width="3" height="40"/><rect x="27" y="0" width="1.5" height="40"/>
            <rect x="31" y="0" width="4" height="40"/><rect x="38" y="0" width="2" height="40"/>
            <rect x="43" y="0" width="1.5" height="40"/><rect x="47" y="0" width="4" height="40"/>
            <rect x="54" y="0" width="1.5" height="40"/><rect x="58" y="0" width="3" height="40"/>
          </svg>
          Kamera belum menyala
        </div>
      </div>
      <div class="bingkai" aria-hidden="true">
        <span class="sudut tl"></span><span class="sudut tr"></span>
        <span class="sudut bl"></span><span class="sudut br"></span>
        <span class="laser"></span>
        <div class="lencana"><div><div class="putar"></div><span id="lencana-teks"></span></div></div>
        <div class="petunjuk petunjuk-atas">Jarak ±15 cm, cahaya cukup</div>
        <div class="petunjuk">Masukkan barcode ke dalam kotak</div>
      </div>
    </div>

    <div class="aksi">
      <button id="btnScan" type="button">Mulai scan</button>
      <label class="tombol-file">
        Pakai foto
        <input type="file" id="foto" accept="image/*" capture="environment">
      </label>
    </div>

    <div id="status" role="status" aria-live="polite">Tekan “Mulai scan”, lalu izinkan akses kamera.</div>

    <article id="hasil" aria-live="polite">
      <span class="cap">Tersimpan</span>
      <p class="judul"></p>
      <p class="meta"></p>
      <div class="isbn"></div>
    </article>

    <h2>Scan sesi ini <span id="jumlah">(0)</span></h2>
    <ul id="riwayat"><li class="kosong">Belum ada buku yang discan.</li></ul>

    <div id="file-reader"></div>
  </main>

  <script>
    const FORMAT = [Html5QrcodeSupportedFormats.EAN_13];
    const scanner = new Html5Qrcode("reader", {
      formatsToSupport: FORMAT,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    const fileScanner = new Html5Qrcode("file-reader", { formatsToSupport: FORMAT, verbose: false });

    const $ = (id) => document.getElementById(id);
    const btnScan = $("btnScan");
    let sedangScan = false;
    let sedangProses = false;
    let terakhir = { isbn: "", waktu: 0 };
    let daftar = [];

    function status(teks, jenis) {
      const el = $("status");
      el.textContent = teks;
      el.className = jenis || "";
    }

    // Keadaan bingkai: "" (siap scan), "proses", "ok", "gagal"
    function bingkai(state, teks) {
      const vf = $("viewfinder");
      if (state) vf.dataset.state = state; else delete vf.dataset.state;
      $("lencana-teks").textContent = teks || "";
    }

    async function mulai() {
      try {
        status("Menyalakan kamera…", "proses");
        await scanner.start(
          { facingMode: "environment" },
          // Tanpa qrbox: seluruh frame dipindai, bingkai di layar hanya panduan.
          // Masker bawaan library tidak pas dengan video yang di-crop (object-fit: cover).
          { fps: 10, aspectRatio: 1 },
          onScan,
          () => {} // abaikan frame yang belum terbaca
        );
        sedangScan = true;
        $("viewfinder").classList.add("aktif");
        btnScan.textContent = "Hentikan";
        btnScan.classList.add("stop");
        status("Kamera aktif. Arahkan ke barcode ISBN.");
      } catch (err) {
        const pesan = String(err && (err.name || err.message || err));
        if (pesan.includes("NotAllowed")) {
          status("Akses kamera ditolak. Buka pengaturan situs di browser, izinkan Kamera, lalu muat ulang halaman.", "error");
        } else if (pesan.includes("NotFound")) {
          status("Kamera tidak ditemukan di perangkat ini. Gunakan tombol “Pakai foto”.", "error");
        } else {
          status("Kamera tidak bisa dinyalakan: " + pesan, "error");
        }
      }
    }

    async function berhenti() {
      if (!sedangScan) return;
      try { await scanner.stop(); } catch (e) {}
      sedangScan = false;
      bingkai("");
      $("viewfinder").classList.remove("aktif");
      btnScan.textContent = "Mulai scan";
      btnScan.classList.remove("stop");
      status("Kamera dimatikan.");
    }

    btnScan.addEventListener("click", () => (sedangScan ? berhenti() : mulai()));

    // Kamera tetap jalan selama memproses (tanpa scanner.pause, yang memunculkan
    // tulisan "Scanner paused"); hasil scan diabaikan sampai jeda selesai.
    async function onScan(teks) {
      const sekarang = Date.now();
      // Abaikan barcode yang sama dalam 5 detik, dan scan baru saat masih memproses
      if (sedangProses || (teks === terakhir.isbn && sekarang - terakhir.waktu < 5000)) return;
      terakhir = { isbn: teks, waktu: sekarang };
      await kirim(teks);
    }

    async function kirim(isbn) {
      sedangProses = true;
      let berhasil = false;
      if (navigator.vibrate) navigator.vibrate(60);
      status("Mencari data ISBN " + isbn + "…", "proses");
      bingkai("proses", "Mencari data…");
      try {
        const res = await fetch("/api/simpan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isbn })
        });
        let data;
        try { data = await res.json(); }
        catch { throw new Error("Server membalas dengan format yang tidak dikenal (kode " + res.status + ")."); }

        if (!data.ok) {
          status(data.pesan || "Gagal menyimpan.", "error");
          return;
        }
        tampilkan(data.buku);
        berhasil = true;
        status(data.buku.ditemukan ? "Tersimpan ke spreadsheet." : "ISBN tersimpan, tapi datanya tidak ada di Google Books. Lengkapi manual di spreadsheet.");
      } catch (err) {
        status("Gagal mengirim: " + err.message, "error");
      } finally {
        bingkai(berhasil ? "ok" : "gagal", berhasil ? "✓ Tersimpan" : "✕ Gagal");
        // Jeda singkat supaya hasil terlihat dan buku sempat diganti
        setTimeout(() => {
          sedangProses = false;
          bingkai("");
          if (sedangScan && berhasil) status("Siap scan buku berikutnya.");
        }, berhasil ? 1500 : 2500);
      }
    }

    function tampilkan(buku) {
      const kartu = $("hasil");
      kartu.querySelector(".judul").textContent = buku.judul;
      const meta = [buku.penulis];
      if (buku.penerbit && buku.penerbit !== "-") meta.push(buku.penerbit);
      if (buku.tahun && buku.tahun !== "-") meta.push(buku.tahun);
      kartu.querySelector(".meta").textContent = meta.join(", ");
      kartu.querySelector(".isbn").textContent = "ISBN " + buku.isbn;
      kartu.querySelector(".cap").textContent = buku.ditemukan ? "Tersimpan" : "Data kosong";
      kartu.classList.toggle("tidak-ketemu", !buku.ditemukan);
      kartu.classList.remove("baru");
      void kartu.offsetWidth; // ulang animasi cap
      kartu.classList.add("tampil", "baru");

      daftar.unshift(buku);
      const ul = $("riwayat");
      ul.innerHTML = "";
      daftar.forEach((b) => {
        const li = document.createElement("li");
        const j = document.createElement("div");
        j.className = "r-judul";
        j.textContent = b.judul;
        const m = document.createElement("div");
        m.className = "r-meta";
        m.textContent = b.penulis + ", ISBN " + b.isbn;
        li.append(j, m);
        ul.append(li);
      });
      $("jumlah").textContent = "(" + daftar.length + ")";
    }

    // Cadangan: scan dari foto (kalau kamera live bermasalah)
    $("foto").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || sedangProses) { e.target.value = ""; return; }
      status("Membaca barcode dari foto…", "proses");
      try {
        const isbn = await fileScanner.scanFile(file, false);
        await kirim(isbn);
      } catch {
        status("Barcode tidak terbaca dari foto. Foto lebih dekat, lurus, dan di tempat terang.", "error");
      } finally {
        e.target.value = "";
      }
    });

    // Matikan kamera saat tab disembunyikan, hemat baterai
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) berhenti();
    });
  </script>
</body>
</html>
